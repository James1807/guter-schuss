<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>Guter Schuss</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}
.player{position:relative;width:100vw;height:100dvh;background:#000;display:flex;align-items:center;justify-content:center}
video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
.poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2;cursor:pointer}
.play{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);
width:92px;height:92px;border-radius:50%;border:2px solid rgba(255,220,170,.95);
background:rgba(25,18,14,.82);color:#fff;font-size:38px;line-height:1;
display:grid;place-items:center;padding-left:7px;box-shadow:0 4px 30px rgba(0,0,0,.5);cursor:pointer}
.play:active{transform:translate(-50%,-50%) scale(.96)}
.controls{position:absolute;z-index:4;left:0;right:0;bottom:0;padding:12px 16px max(18px,env(safe-area-inset-bottom));
display:flex;align-items:center;gap:10px;background:linear-gradient(transparent,rgba(0,0,0,.8));opacity:0;transition:opacity .2s}
.player.active .controls{opacity:1}
.ctrl{border:0;border-radius:50%;width:44px;height:44px;background:rgba(255,255,255,.9);color:#111;font-size:18px;display:grid;place-items:center}
.progress{flex:1;accent-color:white}
.time{color:#fff;font:13px system-ui,sans-serif;min-width:38px}
</style>
</head>
<body>
<main class="player" id="player">
<video id="video" playsinline preload="metadata">
<source src="video.mp4" type="video/mp4">
</video>
<img id="poster" class="poster" src="startbild.jpg" alt="">
<button id="play" class="play" aria-label="Video starten">▶</button>
<div class="controls" id="controls">
<button id="toggle" class="ctrl" aria-label="Pause">❚❚</button>
<span id="time" class="time">0:00</span>
<input id="progress" class="progress" type="range" min="0" max="100" value="0" step=".1" aria-label="Videoposition">
</div>
</main>
<script>
const v=document.getElementById('video'), poster=document.getElementById('poster'), play=document.getElementById('play'),
toggle=document.getElementById('toggle'), progress=document.getElementById('progress'), time=document.getElementById('time'), player=document.getElementById('player');
const fmt=s=>{s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function controls(){player.classList.add('active');clearTimeout(window.t);window.t=setTimeout(()=>player.classList.remove('active'),3000)}
async function start(){try{v.muted=false;v.volume=1;await v.play();poster.style.display='none';play.style.display='none';toggle.textContent='❚❚';controls()}catch(e){}}
play.onclick=start; poster.onclick=start;
toggle.onclick=e=>{e.stopPropagation();if(v.paused){v.play();toggle.textContent='❚❚'}else{v.pause();toggle.textContent='▶'}controls()};
v.addEventListener('click',()=>{if(poster.style.display==='none'){if(v.paused)v.play();else v.pause();toggle.textContent=v.paused?'▶':'❚❚';controls()}});
v.addEventListener('timeupdate',()=>{progress.value=v.duration?(v.currentTime/v.duration*100):0;time.textContent=fmt(v.currentTime)});
progress.oninput=()=>{if(v.duration)v.currentTime=progress.value/100*v.duration;controls()};
v.addEventListener('ended',()=>{toggle.textContent='▶';poster.style.display='block';play.textContent='↻';play.style.display='grid';controls()});
</script>
</body>
</html>
