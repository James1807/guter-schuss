<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Guter Schuss</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .player {
      position: relative;
      width: 100vw;
      height: 100dvh;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #000;
    }
    .start {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      border: 0;
      border-radius: 999px;
      padding: 18px 30px;
      background: rgba(255,255,255,.96);
      color: #111;
      font-size: 20px;
      font-weight: 700;
      box-shadow: 0 8px 30px rgba(0,0,0,.5);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .start:active { transform: translate(-50%, -50%) scale(.97); }
    .hint {
      position: absolute;
      left: 50%;
      bottom: max(24px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      color: rgba(255,255,255,.85);
      font-size: 14px;
      text-align: center;
      width: calc(100% - 40px);
      text-shadow: 0 1px 5px #000;
      pointer-events: none;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main class="player">
    <video id="video" playsinline preload="metadata">
      <source src="video.mp4" type="video/mp4">
      Dein Browser kann dieses Video leider nicht abspielen.
    </video>

    <button id="start" class="start" type="button">▶ Video starten</button>
    <div id="hint" class="hint">Einmal tippen – das Video startet mit Ton.</div>
  </main>

  <script>
    const video = document.getElementById("video");
    const start = document.getElementById("start");
    const hint = document.getElementById("hint");

    start.addEventListener("click", async () => {
      try {
        video.muted = false;
        video.volume = 1;
        await video.play();
        start.classList.add("hidden");
        hint.classList.add("hidden");
      } catch (e) {
        // If the browser still blocks playback, keep the button visible.
      }
    });

    video.addEventListener("ended", () => {
      start.textContent = "↻ Nochmal abspielen";
      start.classList.remove("hidden");
      hint.classList.remove("hidden");
      hint.textContent = "Noch einmal tippen, um das Video erneut abzuspielen.";
    });
  </script>
</body>
</html>
