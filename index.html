<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17120d">
  
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #17120d;
      color: #fff;
      font-family: Georgia, "Times New Roman", serif;
      padding: 20px;
    }
    main { width: min(900px, 100%); text-align: center; }
    h1 { margin: 0 0 18px; font-size: clamp(28px, 6vw, 52px); font-weight: 500; }
    .video-wrap {
      position: relative;
      overflow: hidden;
      border-radius: 14px;
      background: #000;
      box-shadow: 0 12px 45px rgba(0,0,0,.45);
    }
    video {
      display: block;
      width: 100%;
      height: auto;
      max-height: 80vh;
      background: #000;
    }
    .hint { margin: 14px 0 0; opacity: .75; font-family: Arial, sans-serif; font-size: 14px; }
  </style>
</head>
<body>
  <main>
 
    <div class="video-wrap">
      <video controls autoplay muted playsinline>
        <source src="video.mp4" type="video/mp4">
        Dein Browser kann dieses Video leider nicht abspielen.
      </video>
    </div>
    <p class="hint">Falls das Video nicht automatisch startet, einfach auf ▶ tippen.</p>
  </main>
</body>
</html>
